name: Examples check

# Weekly: does Pointsman still give each prepared report its expected action,
# in both languages? The model's answers can move a little over time
# (pointsman-demo#33). Uses a Pointsman test token (secret
# POINTSMAN_CHECK_TOKEN): its decisions are not logged. A miss opens an issue
# (or comments on the open one). No pull request trigger: the job holds a
# secret and needs no code from a pull request.
on:
  schedule:
    # Mondays 00:00 UTC (09:00 JST).
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the prepared reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # No install: the script uses only Node and src/reports.ts.
      - name: Check
        id: check
        env:
          POINTSMAN_CHECK_TOKEN: ${{ secrets.POINTSMAN_CHECK_TOKEN }}
        run: node scripts/check-examples.mjs "$RUNNER_TEMP/examples-report.md"

      - name: Open or update the issue
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Demo examples check: some examples miss their expected action'
          body_file="$RUNNER_TEMP/issue.md"
          { cat "$RUNNER_TEMP/examples-report.md" 2>/dev/null || echo 'The check failed before it could write a report.'; echo; echo "Run: $RUN_URL"; } > "$body_file"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file"
          fi
